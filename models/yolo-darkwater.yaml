# YOLO-DarkWater v1.0
# ==============================================================================
# Custom architecture for real-time underwater marine debris detection.
#
# Key architectural decisions (FROZEN — do not modify without compilation failure):
#
#   1. Stem Conv (layer 0): STANDARD Conv(3→64, k=3, s=2)
#      Reason: Early layers learn edges, textures, gradients — fundamental low-level
#      features. GhostConv at 3 input channels saves negligible FLOPs but risks
#      degrading feature quality for subsequent backbone stages.
#
#   2. Backbone/Head (layers 1+): GhostConv + GhostC2f
#      Reason: High channel counts (128→1024) produce many redundant feature maps.
#      GhostConv generates half via standard conv, half via cheap depthwise ops.
#      Result: ~40% FLOPs reduction vs standard Conv backbone.
#
#   3. CBAM at P3 (layer 5, after 256ch GhostC2f):
#      Reason: P3 retains highest resolution spatial detail — spatial attention
#      is most effective here. Channel attention suppresses red-channel attenuation
#      artefacts dominant in underwater turbid imagery.
#      P4/P5 placement doubles attention cost with diminishing returns on small datasets.
#
#   4. SPPF unchanged:
#      Reason: SPPF is a pooling aggregation layer — no convolutions to replace.
#
# Transfer learning: All shape-compatible layers transfer from YOLOv8n pretrained weights.
# GhostConv / CBAM layers with shape mismatches initialize randomly.
#
# Version: YOLO-DarkWater v1.0
# ==============================================================================

# Number of classes (TrashCan dataset: 8 trash + 8 marine life + 1 ROV categories)
nc: 16

# Scale factors for nano variant (matches YOLOv8n footprint)
# [depth_multiple, width_multiple, max_channels]
scales:
  n: [0.33, 0.25, 1024]

# ==============================================================================
# BACKBONE
# [from, repeats, module, args]
# ==============================================================================
backbone:
  # Layer 0 — P1/2 — STANDARD Conv (stem, learns fundamental low-level features)
  - [-1, 1, Conv,      [64, 3, 2]]

  # Layer 1 — P2/4 — GhostConv (ghost features safe from 64ch onwards)
  - [-1, 1, GhostConv, [128, 3, 2]]

  # Layer 2 — GhostC2f (cross-stage partial with ghost bottlenecks)
  - [-1, 3, GhostC2f,  [128, True]]

  # Layer 3 — P3/8
  - [-1, 1, GhostConv, [256, 3, 2]]

  # Layer 4 — GhostC2f at P3 (6 repeats for rich feature extraction)
  - [-1, 6, GhostC2f,  [256, True]]

  # Layer 5 — CBAM attention at P3 (256ch, best accuracy/compute tradeoff)
  # Channel attention: suppresses spectral noise from underwater colour absorption
  # Spatial attention: focuses on debris regions in high-resolution P3 features
  - [-1, 1, CBAM,      [256]]

  # Layer 6 — P4/16
  - [-1, 1, GhostConv, [512, 3, 2]]

  # Layer 7 — GhostC2f at P4
  - [-1, 6, GhostC2f,  [512, True]]

  # Layer 8 — P5/32
  - [-1, 1, GhostConv, [1024, 3, 2]]

  # Layer 9 — GhostC2f at P5
  - [-1, 3, GhostC2f,  [1024, True]]

  # Layer 10 — SPPF (spatial pyramid pooling, unchanged from YOLOv8n)
  - [-1, 1, SPPF,      [1024, 5]]

# ==============================================================================
# HEAD (PAN-FPN with GhostConv)
# ==============================================================================
head:
  # ---- P5 → P4 upsampling path ----

  # Layer 11 — Upsample P5 features (1024 → 1024)
  - [-1,  1, nn.Upsample, [None, 2, 'nearest']]

  # Layer 12 — Concatenate with P4 backbone features (1024 + 512 = 1536ch input)
  - [[-1, 7], 1, Concat, [1]]

  # Layer 13 — GhostC2f fuses P5+P4 → 512ch
  - [-1,  3, GhostC2f,   [512]]

  # ---- P4 → P3 upsampling path ----

  # Layer 14 — Upsample fused P4 features
  - [-1,  1, nn.Upsample, [None, 2, 'nearest']]

  # Layer 15 — Concatenate with P3 backbone (post-CBAM, 512 + 256 = 768ch input)
  - [[-1, 5], 1, Concat, [1]]

  # Layer 16 — GhostC2f fuses P4+P3 → 256ch (small object detection head)
  - [-1,  3, GhostC2f,   [256]]

  # ---- P3 → P4 downsampling path ----

  # Layer 17 — GhostConv downsample P3 features
  - [-1,  1, GhostConv,  [256, 3, 2]]

  # Layer 18 — Concatenate with P4 head features (256 + 512 = 768ch input)
  - [[-1, 13], 1, Concat, [1]]

  # Layer 19 — GhostC2f fuses → 512ch (medium object detection head)
  - [-1,  3, GhostC2f,   [512]]

  # ---- P4 → P5 downsampling path ----

  # Layer 20 — GhostConv downsample P4 features
  - [-1,  1, GhostConv,  [512, 3, 2]]

  # Layer 21 — Concatenate with P5 backbone SPPF (512 + 1024 = 1536ch input)
  - [[-1, 10], 1, Concat, [1]]

  # Layer 22 — GhostC2f fuses → 1024ch (large object detection head)
  - [-1,  3, GhostC2f,   [1024]]

  # ---- Detection Head ----

  # Layer 23 — Detect from P3, P4, P5 feature pyramids
  - [[16, 19, 22], 1, Detect, [nc]]