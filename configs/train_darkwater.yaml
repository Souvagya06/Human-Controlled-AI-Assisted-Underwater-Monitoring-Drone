# =============================================================================
# YOLO-DarkWater Project — YOLO-DarkWater Training Configuration
# Model: Custom YOLO-DarkWater (GhostConv + CBAM + Wise-IoU, NO pretrained weights)
# =============================================================================

# --- Model & Data ---
model: runs/detect/results/darkwater/darkwater_run/weights/last.pt
resume: true
data: data/dataset.yaml              # Will be resolved to absolute path by train.py

# --- Training Duration ---
epochs: 150
imgsz: 640

# --- Batch & Workers ---
batch: 16
workers: 4

# --- Optimizer ---
# Lower LR than baseline: custom arch trains from scratch, needs stable early convergence
optimizer: AdamW
lr0: 0.005                           # Conservative initial LR for untrained architecture
lrf: 0.01                            # Final LR = lr0 * lrf
momentum: 0.937
weight_decay: 0.0005

# --- Warmup ---
# Longer warmup: no pretrained weights, architecture needs gradual ramp
warmup_epochs: 5
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# --- Augmentation ---
augment: true                        # Ultralytics built-in augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
fliplr: 0.5
mosaic: 1.0

# --- Device & Reproducibility ---
device: "0"                          # GPU 0 (RTX 5050)
seed: 42
deterministic: true

# --- Output ---
project: results/darkwater
name: darkwater_run
save_period: 25
exist_ok: true
plots: true

# --- DarkWater-specific flags ---
enable_preprocessing: true           # Underwater enhancement ON (CLAHE, WB, Gamma, Contrast)
loss_type: wiou                      # Wise-IoU v3 loss ('wiou' | 'ciou')

# --- Underwater Enhancement Parameters (used when enable_preprocessing=true) ---
clahe_clip_limit: 3.0
clahe_tile_grid: 8                   # tile_grid = (clahe_tile_grid, clahe_tile_grid)
gamma: 1.2
contrast_percentile_low: 2
contrast_percentile_high: 98

# --- Wise-IoU Parameters (used when loss_type='wiou') ---
wiou_alpha: 1.9
wiou_delta: 3.0
